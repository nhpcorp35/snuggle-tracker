<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snuggle Vault Tracker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230f1318'/><text y='24' x='4' font-size='22' fill='%234a9eff'>◈</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
<style>
  :root {
    --bg:        #090c10;
    --surface:   #0f1318;
    --border:    #1d2330;
    --border2:   #252d3a;
    --text:      #c8d0de;
    --muted:     #7a8899;
    --green:     #2dcd7a;
    --green-dim: rgba(45,205,122,0.12);
    --red:       #f4545c;
    --red-dim:   rgba(244,84,92,0.12);
    --amber:     #f5a623;
    --amber-dim: rgba(245,166,35,0.12);
    --blue:      #4a9eff;
    --blue-dim:  rgba(74,158,255,0.10);
    --mono:      "IBM Plex Mono", monospace;
    --sans:      "IBM Plex Sans", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 14px; line-height: 1.5; min-height: 100vh; }
  header { border-bottom: 1px solid var(--border); padding: 14px 24px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .logo { font-family: var(--mono); font-size: 13px; font-weight: 500; letter-spacing: 0.12em; color: var(--blue); text-transform: uppercase; display: flex; align-items: center; gap: 8px; text-decoration: none; }
  .logo::before { content: "◈"; font-size: 16px; }
  .back-btn { font-family: var(--mono); font-size: 12px; color: var(--muted); text-decoration: none; padding: 5px 10px; border: 1px solid var(--border2); border-radius: 6px; transition: all 0.15s; white-space: nowrap; }
  .back-btn:hover { color: var(--blue); border-color: var(--blue); }
  .btn { background: var(--blue); color: #fff; border: none; font-family: var(--mono); font-size: 12px; font-weight: 500; padding: 8px 16px; border-radius: 6px; cursor: pointer; letter-spacing: 0.05em; white-space: nowrap; transition: opacity 0.15s; }
  .btn:hover { opacity: 0.85; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  main { padding: 24px; max-width: 1100px; margin: 0 auto; }
  #status-bar { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-bottom: 20px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
  .status-dot.green { background: var(--green); box-shadow: 0 0 6px var(--green); }
  #wallet-input { background: var(--surface); border: 1px solid var(--border2); color: var(--text); font-family: var(--mono); font-size: 12px; padding: 6px 10px; border-radius: 6px; width: 340px; max-width: 100%; }
  .error-banner { background: var(--red-dim); border: 1px solid rgba(244,84,92,0.25); border-radius: 8px; padding: 12px 16px; font-family: var(--mono); font-size: 12px; color: var(--red); margin-bottom: 20px; display: none; }
  .error-banner.visible { display: block; }
  .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 80px 24px; gap: 16px; color: var(--muted); }
  .empty-state .icon { font-size: 48px; opacity: 0.4; }
  .empty-state p { font-family: var(--mono); font-size: 13px; text-align: center; max-width: 340px; line-height: 1.7; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  .loading-pulse { animation: pulse 1.4s ease-in-out infinite; }

  .positions { display: flex; flex-direction: column; gap: 14px; }
  .position-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 18px 20px; }
  .range-bar-block { margin: 14px 0; }
  .range-bar-header { display: flex; justify-content: space-between; align-items: baseline; font-family: var(--mono); font-size: 11px; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.05em; }
  .range-bar-header .width-val { color: var(--text); }
  .range-bar-track { position: relative; height: 8px; background: var(--border); border-radius: 4px; margin: 4px 0; }
  .range-bar-fill { position: absolute; top: 0; height: 100%; border-radius: 4px; background: var(--green-dim); border: 1px solid rgba(45,205,122,0.4); }
  .position-card.out-range .range-bar-fill { background: rgba(244,84,92,0.10); border-color: rgba(244,84,92,0.35); }
  .range-bar-marker { position: absolute; top: -4px; width: 2px; height: 16px; background: var(--blue); transform: translateX(-1px); }
  .range-bar-labels { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 11px; margin-top: 6px; }
  .range-bar-edge { color: var(--muted); }
  .range-bar-edge .edge-price { color: var(--text); }
  .range-bar-edge .edge-away { color: var(--amber); }
  .range-bar-current { color: var(--blue); text-align: center; }
  .position-card.in-range { border-left: 3px solid var(--green); }
  .position-card.out-range { border-left: 3px solid var(--amber); }
  .pos-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .pos-title { font-family: var(--mono); font-size: 15px; font-weight: 500; color: var(--text); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .pos-title .fee-tag { font-size: 11px; color: var(--muted); background: var(--border); padding: 2px 8px; border-radius: 4px; }
  .pos-title .id-tag { font-size: 11px; color: var(--muted); }
  .range-badge { font-family: var(--mono); font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 6px; letter-spacing: 0.05em; }
  .range-badge.in { background: var(--green-dim); color: var(--green); }
  .range-badge.out { background: var(--amber-dim); color: var(--amber); }

  .pos-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-bottom: 12px; }
  .stat-label { font-family: var(--mono); font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 3px; }
  .stat-value { font-family: var(--mono); font-size: 13px; font-weight: 500; color: var(--text); }
  .stat-value.dim, .dim { color: var(--muted); font-weight: 400; }

  .fees-row { display: flex; align-items: center; justify-content: space-between; background: rgba(32,210,200,0.10); border: 1px solid rgba(32,210,208,0.25); border-radius: 8px; padding: 10px 14px; margin-top: 4px; flex-wrap: wrap; gap: 8px; }
  .rewards-row { background: var(--amber-dim); border-color: rgba(245,166,35,0.3); margin-top: 8px; }
  .rewards-row .fees-value { color: var(--amber); }
  .fees-label { font-family: var(--mono); font-size: 10px; color: #2dd4d0; text-transform: uppercase; letter-spacing: 0.08em; }
  .fees-value { font-family: var(--mono); font-size: 13px; font-weight: 500; color: #2dd4d0; }

  .toggles { display: flex; gap: 14px; margin-top: 10px; font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .toggle-on { color: var(--green); }

  .portfolio-bar { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px 20px; margin-bottom: 20px; }
  .portfolio-stat-label { font-family: var(--mono); font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 4px; }
  .portfolio-stat-value { font-family: var(--mono); font-size: 20px; font-weight: 600; color: var(--text); }
  .portfolio-stat-value.accent { color: var(--blue); }
  .portfolio-stat-value.warn { color: var(--amber); }
  .portfolio-stat-value.pnl-pos, .stat-value.pnl-pos, .pnl-pos { color: var(--green); }
  .portfolio-stat-value.pnl-neg, .stat-value.pnl-neg, .pnl-neg { color: var(--red); }
  .pnl-sub { font-family: var(--mono); font-size: 12px; margin-top: 2px; }

  .oor-duration { font-family: var(--mono); font-size: 11px; color: var(--amber); margin-top: 2px; }

  .protocol-section { margin-bottom: 36px; }
  .protocol-header { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .protocol-title { font-family: var(--mono); font-size: 16px; font-weight: 600; color: var(--text); text-transform: uppercase; letter-spacing: 0.08em; }
  .protocol-status { font-family: var(--mono); font-size: 11px; color: var(--muted); }

  .history-block { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px 20px; margin-bottom: 20px; }
  .history-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; flex-wrap: wrap; gap: 10px; }
  .history-title { font-family: var(--mono); font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
  .range-btns { display: flex; gap: 6px; }
  .range-btn { font-family: var(--mono); font-size: 11px; color: var(--muted); background: transparent; border: 1px solid var(--border2); border-radius: 6px; padding: 4px 10px; cursor: pointer; transition: all 0.15s; }
  .range-btn:hover { color: var(--text); border-color: var(--muted); }
  .range-btn.active { color: var(--blue); border-color: var(--blue); background: var(--blue-dim); }
  .history-chart-wrap { position: relative; height: 220px; }
  .history-empty { font-family: var(--mono); font-size: 12px; color: var(--muted); text-align: center; padding: 40px 0; }

  .pos-history-toggle { font-family: var(--mono); font-size: 11px; color: var(--blue); cursor: pointer; margin-top: 12px; user-select: none; }
  .pos-history-toggle:hover { opacity: 0.8; }
  .pos-history-panel { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
  .pos-history-subheader { font-family: var(--mono); font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin: 14px 0 6px; }

  .closed-block { margin-top: 16px; }
  .closed-toggle { font-family: var(--mono); font-size: 11px; color: var(--muted); cursor: pointer; user-select: none; }
  .closed-toggle:hover { color: var(--text); }
  .closed-list { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
  .closed-item { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; font-family: var(--mono); font-size: 12px; gap: 10px; flex-wrap: wrap; }
  .closed-item-pool { color: var(--text); }
  .closed-item-meta { color: var(--muted); font-size: 11px; }
</style>
</head>
<body>

<header>
  <a href="https://v4.lptracker.info" class="back-btn">← Hub</a>
  <div class="logo" style="cursor:default">Snuggle Tracker</div>
  <div style="flex:1"></div>
  <input id="wallet-input" type="text" placeholder="0x... wallet address (leave blank for default)">
  <button class="btn" id="load-btn" onclick="loadAll(true)">Load</button>
</header>

<main>
  <div class="error-banner" id="error-banner"></div>

  <div class="protocol-section">
    <div class="protocol-header">
      <span class="protocol-title">Snuggle</span>
      <span class="status-dot" id="snuggle-status-dot"></span>
      <span class="protocol-status" id="snuggle-status-text">Loading…</span>
    </div>
    <div id="snuggle-portfolio-container"></div>

    <div class="history-block">
      <div class="history-header">
        <span class="history-title">Portfolio Value History</span>
        <div class="range-btns" id="snuggle-range-btns">
          <button class="range-btn" data-range="7d">7D</button>
          <button class="range-btn active" data-range="30d">30D</button>
          <button class="range-btn" data-range="90d">90D</button>
          <button class="range-btn" data-range="all">All</button>
        </div>
      </div>
      <div class="history-chart-wrap"><canvas id="snuggle-history-chart"></canvas></div>
    </div>

    <div class="positions" id="snuggle-positions-container">
      <div class="empty-state loading-pulse"><div class="icon">◈</div><p>Fetching Snuggle positions…</p></div>
    </div>

    <div id="snuggle-closed-container"></div>
  </div>

  <div class="protocol-section">
    <div class="protocol-header">
      <span class="protocol-title">MaxFi</span>
      <span class="status-dot" id="maxfi-status-dot"></span>
      <span class="protocol-status" id="maxfi-status-text">Loading…</span>
    </div>
    <div id="maxfi-portfolio-container"></div>

    <div class="history-block">
      <div class="history-header">
        <span class="history-title">Portfolio Value History</span>
        <div class="range-btns" id="maxfi-range-btns">
          <button class="range-btn" data-range="7d">7D</button>
          <button class="range-btn active" data-range="30d">30D</button>
          <button class="range-btn" data-range="90d">90D</button>
          <button class="range-btn" data-range="all">All</button>
        </div>
      </div>
      <div class="history-chart-wrap"><canvas id="maxfi-history-chart"></canvas></div>
    </div>

    <div class="positions" id="maxfi-positions-container">
      <div class="empty-state loading-pulse"><div class="icon">◈</div><p>Fetching MaxFi positions…</p></div>
    </div>

    <div id="maxfi-closed-container"></div>
  </div>
</main>

<script>
const errorBanner = document.getElementById('error-banner');
const loadBtn = document.getElementById('load-btn');

const AUTO_REFRESH_MS = 90000; // 90s — aligned with the backend's 120s cache TTL
let autoRefreshTimer = null;

// Both protocols use identical response shape and card layout — this
// name → element mapping is all that differs between them.
const PROTOCOLS = {
  snuggle: {
    endpoint: '/api/snuggle/positions',
    historyEndpoint: '/api/snuggle/history',
    closedEndpoint: '/api/snuggle/closed',
    statusDot: document.getElementById('snuggle-status-dot'),
    statusText: document.getElementById('snuggle-status-text'),
    portfolioContainer: document.getElementById('snuggle-portfolio-container'),
    positionsContainer: document.getElementById('snuggle-positions-container'),
    closedContainer: document.getElementById('snuggle-closed-container'),
    chartCanvas: document.getElementById('snuggle-history-chart'),
    rangeBtnsContainer: document.getElementById('snuggle-range-btns'),
    chartInstance: null,
    currentRange: '30d',
    emptyLabel: 'Snuggle',
    autoToggleLabel: 'Auto-Snuggle',
  },
  maxfi: {
    endpoint: '/api/maxfi/positions',
    historyEndpoint: '/api/maxfi/history',
    closedEndpoint: '/api/maxfi/closed',
    statusDot: document.getElementById('maxfi-status-dot'),
    statusText: document.getElementById('maxfi-status-text'),
    portfolioContainer: document.getElementById('maxfi-portfolio-container'),
    positionsContainer: document.getElementById('maxfi-positions-container'),
    closedContainer: document.getElementById('maxfi-closed-container'),
    chartCanvas: document.getElementById('maxfi-history-chart'),
    rangeBtnsContainer: document.getElementById('maxfi-range-btns'),
    chartInstance: null,
    currentRange: '30d',
    emptyLabel: 'MaxFi',
    autoToggleLabel: 'Auto-Rebalance',
  },
};

function fmtNum(n, decimals) {
  if (n === null || n === undefined) return '—';
  return Number(n).toLocaleString(undefined, { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
}

function fmtUsd(n) {
  if (n === null || n === undefined) return null;
  return '$' + Number(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function fmtPct(n, decimals) {
  if (n === null || n === undefined) return '—';
  return Number(n).toLocaleString(undefined, { minimumFractionDigits: decimals, maximumFractionDigits: decimals }) + '%';
}

function fmtDuration(seconds) {
  if (!seconds || seconds <= 0) return null;
  const hours = seconds / 3600;
  if (hours < 1) return Math.round(seconds / 60) + 'm';
  if (hours < 48) return hours.toFixed(1) + 'h';
  return (hours / 24).toFixed(1) + 'd';
}

function fmtAge(depositTimestamp) {
  if (!depositTimestamp) return null;
  const openedAt = new Date(depositTimestamp * 1000);
  const wholeDays = Math.floor((Date.now() - openedAt.getTime()) / 86400000);
  const relative = wholeDays < 1 ? 'today' : wholeDays === 1 ? '1 day ago' : `${wholeDays} days ago`;
  const dateStr = openedAt.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
  return { relative, dateStr };
}

function feeTierLabel(feeRaw) {
  return (feeRaw / 10000).toFixed(2) + '%';
}

function renderRangeBar(p) {
  const { price_lower: lo, price_upper: hi, current_price: cur } = p;
  if (lo === null || lo === undefined || hi === null || hi === undefined ||
      cur === null || cur === undefined || hi <= lo) {
    return '';
  }
  const span = hi - lo;
  const pad = span * 0.15;
  const rangeMin = lo - pad;
  const rangeMax = hi + pad;
  const pct = (v) => ((v - rangeMin) / (rangeMax - rangeMin)) * 100;
  const fillLeft = pct(lo);
  const fillWidth = pct(hi) - pct(lo);
  const markerLeft = Math.min(100, Math.max(0, pct(cur)));

  const pctLowerLabel = (p.pct_from_lower !== null && p.pct_from_lower !== undefined)
    ? `${p.pct_from_lower.toFixed(1)}% away` : '';
  const pctUpperLabel = (p.pct_from_upper !== null && p.pct_from_upper !== undefined)
    ? `${p.pct_from_upper.toFixed(1)}% away` : '';
  const widthLabel = fmtPct(p.range_width_pct, 1);

  return `
    <div class="range-bar-block">
      <div class="range-bar-header">
        <span>Price Range</span>
        <span class="width-val">Width ${widthLabel}</span>
      </div>
      <div class="range-bar-track">
        <div class="range-bar-fill" style="left:${fillLeft}%; width:${fillWidth}%;"></div>
        <div class="range-bar-marker" style="left:${markerLeft}%;" title="Current price"></div>
      </div>
      <div class="range-bar-labels">
        <div class="range-bar-edge">
          <div class="edge-price">${fmtPrice(lo)}</div>
          <div class="edge-away">${pctLowerLabel}</div>
        </div>
        <div class="range-bar-current">▲ ${fmtPrice(cur)}</div>
        <div class="range-bar-edge" style="text-align:right;">
          <div class="edge-price">${fmtPrice(hi)}</div>
          <div class="edge-away">${pctUpperLabel}</div>
        </div>
      </div>
    </div>
  `;
}

function fmtPnl(usd, pct) {
  if (usd === null || usd === undefined) return null;
  const cls = usd >= 0 ? 'pnl-pos' : 'pnl-neg';
  const sign = usd >= 0 ? '+' : '-';
  const usdStr = sign + '$' + Math.abs(usd).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const pctStr = (pct !== null && pct !== undefined)
    ? ` (${sign}${Math.abs(pct).toFixed(2)}%)` : '';
  return { cls, text: usdStr + pctStr };
}

function fmtPrice(n) {
  if (n === null || n === undefined) return '—';
  const decimals = n >= 100 ? 0 : n >= 1 ? 2 : 6;
  return '$' + Number(n).toLocaleString(undefined, { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
}

function renderPortfolio(el, portfolio) {
  if (!portfolio || portfolio.position_count === 0) {
    el.innerHTML = '';
    return;
  }
  const totalValue = fmtUsd(portfolio.total_value_usd) || '—';
  const totalFees = fmtUsd(portfolio.total_fees_usd) || '—';
  const blendedApr = fmtPct(portfolio.blended_apr_pct, 1);
  const oorNote = portfolio.out_of_range_count > 0
    ? `<div class="portfolio-stat-value warn">${portfolio.out_of_range_count} / ${portfolio.position_count}</div>`
    : `<div class="portfolio-stat-value">0 / ${portfolio.position_count}</div>`;
  const pnl = fmtPnl(portfolio.total_pnl_usd, portfolio.total_pnl_pct);
  const pnlBlock = pnl
    ? `<div class="portfolio-stat-value ${pnl.cls}">${pnl.text}</div>`
    : `<div class="portfolio-stat-value dim">—</div>`;

  el.innerHTML = `
    <div class="portfolio-bar">
      <div>
        <div class="portfolio-stat-label">Total Value</div>
        <div class="portfolio-stat-value accent">${totalValue}</div>
      </div>
      <div>
        <div class="portfolio-stat-label">Total Fees Earned</div>
        <div class="portfolio-stat-value">${totalFees}</div>
      </div>
      <div>
        <div class="portfolio-stat-label">Total P&L (since tracked)</div>
        ${pnlBlock}
      </div>
      <div>
        <div class="portfolio-stat-label">Blended Avg APR</div>
        <div class="portfolio-stat-value">${blendedApr}</div>
      </div>
      <div>
        <div class="portfolio-stat-label">Out of Range</div>
        ${oorNote}
      </div>
    </div>
  `;
}

function renderPositions(el, positions, cfg, name) {
  if (!positions.length) {
    el.innerHTML = `
      <div class="empty-state">
        <div class="icon">◈</div>
        <p>No ${cfg.emptyLabel} positions found for this wallet.</p>
      </div>`;
    return;
  }

  el.innerHTML = positions.map(p => {
    const sym0 = p.token0.symbol;
    const sym1 = p.token1.symbol;
    const rangeClass = p.in_range ? 'in-range' : 'out-range';
    const badgeClass = p.in_range ? 'in' : 'out';
    const badgeText = p.in_range ? 'In Range' : 'Out of Range';
    const oorDuration = fmtDuration(p.out_of_range_seconds);
    const posKey = `${name}-${p.token_id}`;

    const holdingsLine = (p.amount0 !== null && p.amount1 !== null)
      ? `${fmtNum(p.amount0, 6)} ${sym0} + ${fmtNum(p.amount1, 6)} ${sym1}`
      : `<span class="stat-value dim">unavailable</span>`;

    const usdValue = fmtUsd(p.position_value_usd);
    const usdLine = usdValue
      ? `<div class="stat-value" style="margin-top:2px;">${usdValue}</div>`
      : '';
    const pnl = fmtPnl(p.pnl_usd, p.pnl_pct);
    const pnlLine = pnl
      ? `<div class="pnl-sub ${pnl.cls}">${pnl.text}</div>`
      : '';

    const aprLine = fmtPct(p.lifetime_apr_pct, 1);
    const feesUsd = fmtUsd(p.cumulative_fees_usd);
    const age = fmtAge(p.deposit_timestamp);
    const rewardsRow = p.is_staked
      ? `<div class="fees-row rewards-row">
           <span class="fees-label">Pending ${p.reward_token_symbol || 'Reward'}</span>
           <span class="fees-value">${p.pending_reward !== null && p.pending_reward !== undefined ? fmtNum(p.pending_reward, 6) + ' ' + (p.reward_token_symbol || '') : '—'}${p.pending_reward_usd ? ' (' + fmtUsd(p.pending_reward_usd) + ')' : ''}</span>
         </div>`
      : '';

    return `
      <div class="position-card ${rangeClass}">
        <div class="pos-header">
          <div class="pos-title">
            ${sym0} / ${sym1}
            <span class="fee-tag">${feeTierLabel(p.fee_tier)}</span>
            <span class="id-tag">#${p.token_id}</span>
          </div>
          <div style="text-align:right;">
            <span class="range-badge ${badgeClass}">${badgeText}</span>
            ${oorDuration ? `<div class="oor-duration">for ${oorDuration}</div>` : ''}
          </div>
        </div>

        ${renderRangeBar(p)}

        <div class="pos-grid">
          <div>
            <div class="stat-label">Current Holdings</div>
            <div class="stat-value">${holdingsLine}</div>
            ${usdLine}
            ${pnlLine}
          </div>
          <div>
            <div class="stat-label">Range Width</div>
            <div class="stat-value">${fmtPct(p.range_width_pct, 1)}</div>
            <div class="stat-value dim" style="margin-top:2px;">[${p.tick_lower}, ${p.tick_upper}]</div>
          </div>
          <div>
            <div class="stat-label">Rebalances</div>
            <div class="stat-value">${p.total_rebalances}</div>
          </div>
          <div>
            <div class="stat-label">Lifetime Avg APR</div>
            <div class="stat-value">${aprLine}</div>
          </div>
          <div>
            <div class="stat-label">Position Age</div>
            <div class="stat-value">${age ? age.relative : '—'}</div>
            ${age ? `<div class="stat-value dim" style="margin-top:2px;">${age.dateStr}</div>` : ''}
          </div>
        </div>

        <div class="fees-row">
          <span class="fees-label">Lifetime Fees Earned</span>
          <span class="fees-value">${fmtNum(p.cumulative_fees0, 6)} ${sym0} / ${fmtNum(p.cumulative_fees1, 6)} ${sym1}${feesUsd ? ' (' + feesUsd + ')' : ''}</span>
        </div>
        ${rewardsRow}

        <div class="toggles">
          <span class="${p.auto_snuggle ? 'toggle-on' : ''}">${cfg.autoToggleLabel}: ${p.auto_snuggle ? 'ON' : 'off'}</span>
          <span class="${p.auto_compound ? 'toggle-on' : ''}">Compound: ${p.auto_compound ? 'ON' : 'off'}</span>
        </div>

        <div class="pos-history-toggle" onclick="togglePositionHistory('${name}', ${p.token_id})">
          <span id="pos-history-arrow-${posKey}">▸</span> Position History
        </div>
        <div class="pos-history-panel" id="pos-history-panel-${posKey}" style="display:none;">
          <div class="range-btns" id="pos-history-btns-${posKey}">
            <button class="range-btn" onclick="setPositionHistoryRange('${name}', ${p.token_id}, '7d', this)">7D</button>
            <button class="range-btn active" onclick="setPositionHistoryRange('${name}', ${p.token_id}, '30d', this)">30D</button>
            <button class="range-btn" onclick="setPositionHistoryRange('${name}', ${p.token_id}, '90d', this)">90D</button>
            <button class="range-btn" onclick="setPositionHistoryRange('${name}', ${p.token_id}, 'all', this)">All</button>
          </div>
          <div class="history-chart-wrap" style="height:160px;"><canvas id="pos-history-chart-${posKey}"></canvas></div>

          <div class="pos-history-subheader">Pool Volume (USD)</div>
          <div class="range-btns" id="pos-volume-btns-${posKey}">
            <button class="range-btn" onclick="setPositionVolumeRange('${name}', ${p.token_id}, '7d', this)">7D</button>
            <button class="range-btn active" onclick="setPositionVolumeRange('${name}', ${p.token_id}, '30d', this)">30D</button>
            <button class="range-btn" onclick="setPositionVolumeRange('${name}', ${p.token_id}, '60d', this)">60D</button>
            <button class="range-btn" onclick="setPositionVolumeRange('${name}', ${p.token_id}, '90d', this)">90D</button>
            <button class="range-btn" onclick="setPositionVolumeRange('${name}', ${p.token_id}, '180d', this)">180D</button>
          </div>
          <div class="history-chart-wrap" style="height:120px;"><canvas id="pos-volume-chart-${posKey}"></canvas></div>
        </div>
      </div>
    `;
  }).join('');
}

async function loadHistory(name) {
  const cfg = PROTOCOLS[name];
  try {
    const res = await fetch(`${cfg.historyEndpoint}?range=${cfg.currentRange}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'History request failed');
    renderHistoryChart(cfg, data.snapshots || []);
  } catch (e) {
    // Non-fatal — history is a secondary feature, don't blow up the whole
    // page load over it. Just show an empty-state message in the chart area.
    if (cfg.chartInstance) { cfg.chartInstance.destroy(); cfg.chartInstance = null; }
    cfg.chartCanvas.style.display = 'none';
    const wrap = cfg.chartCanvas.parentElement;
    let msg = wrap.querySelector('.history-empty');
    if (!msg) { msg = document.createElement('div'); msg.className = 'history-empty'; wrap.appendChild(msg); }
    msg.textContent = 'History unavailable: ' + e.message;
  }
}

function renderHistoryChart(cfg, snapshots) {
  const wrap = cfg.chartCanvas.parentElement;
  const existingMsg = wrap.querySelector('.history-empty');

  if (!snapshots.length) {
    if (cfg.chartInstance) { cfg.chartInstance.destroy(); cfg.chartInstance = null; }
    cfg.chartCanvas.style.display = 'none';
    let msg = existingMsg;
    if (!msg) { msg = document.createElement('div'); msg.className = 'history-empty'; wrap.appendChild(msg); }
    msg.textContent = 'No history yet for this range — snapshots are recorded hourly starting from when this tracker was deployed.';
    return;
  }

  if (existingMsg) existingMsg.remove();
  cfg.chartCanvas.style.display = 'block';

  const labels = snapshots.map(s => new Date(s.ts * 1000));
  const values = snapshots.map(s => s.total_value_usd);
  const fees = snapshots.map(s => s.total_fees_usd);

  if (cfg.chartInstance) cfg.chartInstance.destroy();
  cfg.chartInstance = new Chart(cfg.chartCanvas, {
    type: 'line',
    data: {
      labels: labels,
      datasets: [
        {
          label: 'Total Value (USD)',
          data: values,
          borderColor: '#4a9eff',
          backgroundColor: 'rgba(74,158,255,0.08)',
          fill: true,
          tension: 0.25,
          pointRadius: 0,
          yAxisID: 'y',
        },
        {
          label: 'Total Fees Earned (USD)',
          data: fees,
          borderColor: '#2dd4d0',
          backgroundColor: 'transparent',
          fill: false,
          tension: 0.25,
          pointRadius: 0,
          yAxisID: 'y1',
        },
      ],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      scales: {
        x: { type: 'time', time: { tooltipFormat: 'MMM d, HH:mm' },
             ticks: { color: '#7a8899', font: { family: 'IBM Plex Mono', size: 10 } },
             grid: { color: '#1d2330' } },
        y: { position: 'left', ticks: { color: '#7a8899', font: { family: 'IBM Plex Mono', size: 10 } },
             grid: { color: '#1d2330' } },
        y1: { position: 'right', ticks: { color: '#7a8899', font: { family: 'IBM Plex Mono', size: 10 } },
              grid: { display: false } },
      },
      plugins: {
        legend: { labels: { color: '#c8d0de', font: { family: 'IBM Plex Mono', size: 11 } } },
      },
    },
  });
}

for (const name of Object.keys(PROTOCOLS)) {
  const cfg = PROTOCOLS[name];
  cfg.rangeBtnsContainer.querySelectorAll('.range-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      cfg.rangeBtnsContainer.querySelectorAll('.range-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      cfg.currentRange = btn.dataset.range;
      loadHistory(name);
    });
  });
}

const positionChartInstances = {};
const positionCurrentRange = {};
const positionVolumeChartInstances = {};
const positionVolumeCurrentRange = {};
const positionPanelOpened = {}; // lazy-load: don't fetch until first expand

function togglePositionHistory(name, tokenId) {
  const posKey = `${name}-${tokenId}`;
  const panel = document.getElementById(`pos-history-panel-${posKey}`);
  const arrow = document.getElementById(`pos-history-arrow-${posKey}`);
  const isOpen = panel.style.display !== 'none';

  if (isOpen) {
    panel.style.display = 'none';
    arrow.textContent = '▸';
    return;
  }

  panel.style.display = 'block';
  arrow.textContent = '▾';

  if (!positionPanelOpened[posKey]) {
    positionPanelOpened[posKey] = true;
    positionCurrentRange[posKey] = '30d';
    positionVolumeCurrentRange[posKey] = '30d';
    loadPositionHistory(name, tokenId, '30d');
    loadPositionVolume(name, tokenId, '30d');
  }
}

// After a full auto-refresh re-render, positions are recreated from
// scratch — this re-opens any panel that was expanded before the
// refresh, at its previously-selected range, so state isn't silently
// lost every 90s.
function restoreOpenPositionHistories(name, positions) {
  for (const p of positions) {
    const posKey = `${name}-${p.token_id}`;
    if (!positionPanelOpened[posKey]) continue;

    const panel = document.getElementById(`pos-history-panel-${posKey}`);
    const arrow = document.getElementById(`pos-history-arrow-${posKey}`);
    if (!panel) continue; // position no longer present

    panel.style.display = 'block';
    if (arrow) arrow.textContent = '▾';

    const range = positionCurrentRange[posKey] || '30d';
    const btnsContainer = document.getElementById(`pos-history-btns-${posKey}`);
    if (btnsContainer) {
      btnsContainer.querySelectorAll('.range-btn').forEach(b => {
        b.classList.toggle('active', b.textContent.trim().toLowerCase() === range.toLowerCase());
      });
    }
    loadPositionHistory(name, p.token_id, range);

    const volRange = positionVolumeCurrentRange[posKey] || '30d';
    const volBtnsContainer = document.getElementById(`pos-volume-btns-${posKey}`);
    if (volBtnsContainer) {
      volBtnsContainer.querySelectorAll('.range-btn').forEach(b => {
        b.classList.toggle('active', b.textContent.trim().toLowerCase() === volRange.toLowerCase());
      });
    }
    loadPositionVolume(name, p.token_id, volRange);
  }
}

function setPositionHistoryRange(name, tokenId, range, btnEl) {
  const posKey = `${name}-${tokenId}`;
  positionCurrentRange[posKey] = range;
  btnEl.parentElement.querySelectorAll('.range-btn').forEach(b => b.classList.remove('active'));
  btnEl.classList.add('active');
  loadPositionHistory(name, tokenId, range);
}

async function loadPositionHistory(name, tokenId, range) {
  const posKey = `${name}-${tokenId}`;
  const canvas = document.getElementById(`pos-history-chart-${posKey}`);
  try {
    const res = await fetch(`/api/${name}/history/${tokenId}?range=${range}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Request failed');
    renderPositionHistoryChart(posKey, canvas, data.snapshots || []);
  } catch (e) {
    if (positionChartInstances[posKey]) { positionChartInstances[posKey].destroy(); positionChartInstances[posKey] = null; }
    canvas.style.display = 'none';
    const wrap = canvas.parentElement;
    let msg = wrap.querySelector('.history-empty');
    if (!msg) { msg = document.createElement('div'); msg.className = 'history-empty'; wrap.appendChild(msg); }
    msg.textContent = 'History unavailable: ' + e.message;
  }
}

function renderPositionHistoryChart(posKey, canvas, snapshots) {
  const wrap = canvas.parentElement;
  const existingMsg = wrap.querySelector('.history-empty');

  if (!snapshots.length) {
    if (positionChartInstances[posKey]) { positionChartInstances[posKey].destroy(); positionChartInstances[posKey] = null; }
    canvas.style.display = 'none';
    let msg = existingMsg;
    if (!msg) { msg = document.createElement('div'); msg.className = 'history-empty'; wrap.appendChild(msg); }
    msg.textContent = 'No history yet for this position in this range.';
    return;
  }

  if (existingMsg) existingMsg.remove();
  canvas.style.display = 'block';

  const labels = snapshots.map(s => new Date(s.ts * 1000));
  const values = snapshots.map(s => s.value_usd);

  if (positionChartInstances[posKey]) positionChartInstances[posKey].destroy();
  positionChartInstances[posKey] = new Chart(canvas, {
    type: 'line',
    data: {
      labels: labels,
      datasets: [{
        label: 'Position Value (USD)',
        data: values,
        borderColor: '#4a9eff',
        backgroundColor: 'rgba(74,158,255,0.08)',
        fill: true,
        tension: 0.25,
        pointRadius: 0,
      }],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        x: { type: 'time', time: { tooltipFormat: 'MMM d, HH:mm' },
             ticks: { color: '#7a8899', font: { family: 'IBM Plex Mono', size: 9 } },
             grid: { color: '#1d2330' } },
        y: { ticks: { color: '#7a8899', font: { family: 'IBM Plex Mono', size: 9 } },
             grid: { color: '#1d2330' } },
      },
      plugins: { legend: { display: false } },
    },
  });
}

function setPositionVolumeRange(name, tokenId, range, btnEl) {
  const posKey = `${name}-${tokenId}`;
  positionVolumeCurrentRange[posKey] = range;
  btnEl.parentElement.querySelectorAll('.range-btn').forEach(b => b.classList.remove('active'));
  btnEl.classList.add('active');
  loadPositionVolume(name, tokenId, range);
}

async function loadPositionVolume(name, tokenId, range) {
  const posKey = `${name}-${tokenId}`;
  const canvas = document.getElementById(`pos-volume-chart-${posKey}`);
  if (!canvas) return;
  try {
    const res = await fetch(`/api/${name}/pool-volume/${tokenId}?range=${range}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Request failed');
    renderPositionVolumeChart(posKey, canvas, data.candles || []);
  } catch (e) {
    if (positionVolumeChartInstances[posKey]) { positionVolumeChartInstances[posKey].destroy(); positionVolumeChartInstances[posKey] = null; }
    canvas.style.display = 'none';
    const wrap = canvas.parentElement;
    let msg = wrap.querySelector('.volume-empty');
    if (!msg) { msg = document.createElement('div'); msg.className = 'history-empty volume-empty'; wrap.appendChild(msg); }
    msg.textContent = 'Volume unavailable: ' + e.message;
  }
}

function renderPositionVolumeChart(posKey, canvas, candles) {
  const wrap = canvas.parentElement;
  const existingMsg = wrap.querySelector('.volume-empty');

  if (!candles.length) {
    if (positionVolumeChartInstances[posKey]) { positionVolumeChartInstances[posKey].destroy(); positionVolumeChartInstances[posKey] = null; }
    canvas.style.display = 'none';
    let msg = existingMsg;
    if (!msg) { msg = document.createElement('div'); msg.className = 'history-empty volume-empty'; wrap.appendChild(msg); }
    msg.textContent = 'No volume data available for this pool.';
    return;
  }

  if (existingMsg) existingMsg.remove();
  canvas.style.display = 'block';

  const labels = candles.map(c => new Date(c.ts * 1000));
  const values = candles.map(c => c.volume_usd);

  if (positionVolumeChartInstances[posKey]) positionVolumeChartInstances[posKey].destroy();
  positionVolumeChartInstances[posKey] = new Chart(canvas, {
    type: 'bar',
    data: {
      labels: labels,
      datasets: [{
        label: 'Pool Volume (USD)',
        data: values,
        backgroundColor: 'rgba(32,210,208,0.35)',
        borderColor: 'rgba(32,210,208,0.6)',
        borderWidth: 1,
      }],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        x: { type: 'time', time: { unit: 'day', tooltipFormat: 'MMM d' },
             ticks: { color: '#7a8899', font: { family: 'IBM Plex Mono', size: 9 } },
             grid: { color: '#1d2330' } },
        y: { ticks: { color: '#7a8899', font: { family: 'IBM Plex Mono', size: 9 } },
             grid: { color: '#1d2330' } },
      },
      plugins: { legend: { display: false } },
    },
  });
}

let closedListShown = { snuggle: false, maxfi: false };

async function loadClosedPositions(name) {
  const cfg = PROTOCOLS[name];
  try {
    const res = await fetch(cfg.closedEndpoint);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Request failed');
    renderClosedPositions(name, data.closed || []);
  } catch (e) {
    cfg.closedContainer.innerHTML = '';
  }
}

function fmtAgo(ts) {
  const seconds = Date.now() / 1000 - ts;
  const days = seconds / 86400;
  if (days < 1) return Math.round(seconds / 3600) + 'h ago';
  return days.toFixed(1) + 'd ago';
}

function renderClosedPositions(name, closed) {
  const cfg = PROTOCOLS[name];
  if (!closed.length) {
    cfg.closedContainer.innerHTML = '';
    return;
  }

  const isShown = closedListShown[name];
  const itemsHtml = closed.map(c => `
    <div class="closed-item">
      <span class="closed-item-pool">${c.pool || '—'} #${c.token_id}</span>
      <span class="closed-item-meta">closed ${fmtAgo(c.closed_at)} · last value ${c.last_value_usd !== null && c.last_value_usd !== undefined ? '$' + c.last_value_usd.toFixed(2) : '—'}</span>
    </div>
  `).join('');

  cfg.closedContainer.innerHTML = `
    <div class="closed-block">
      <div class="closed-toggle" onclick="toggleClosedList('${name}')">
        ${isShown ? '▾' : '▸'} Closed Positions (${closed.length})
      </div>
      <div class="closed-list" style="display:${isShown ? 'flex' : 'none'};">
        ${itemsHtml}
      </div>
    </div>
  `;
}

function toggleClosedList(name) {
  closedListShown[name] = !closedListShown[name];
  loadClosedPositions(name);
}

async function loadProtocol(name, bust) {
  const cfg = PROTOCOLS[name];
  cfg.statusDot.className = 'status-dot';
  cfg.statusText.textContent = 'Loading…';

  const wallet = document.getElementById('wallet-input').value.trim();
  let url = cfg.endpoint;
  const params = [];
  if (wallet) params.push('wallet=' + encodeURIComponent(wallet));
  if (bust) params.push('bust=1');
  if (params.length) url += '?' + params.join('&');

  try {
    const res = await fetch(url);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Request failed');

    renderPositions(cfg.positionsContainer, data.positions || [], cfg, name);
    restoreOpenPositionHistories(name, data.positions || []);
    renderPortfolio(cfg.portfolioContainer, data.portfolio);
    cfg.statusDot.classList.add('green');
    const cachedNote = data.cached ? (data.stale ? ' (stale — last good fetch)' : ' (cached)') : '';
    cfg.statusText.textContent = `${data.positions.length} position(s) · fetched ${new Date(data.fetched_at * 1000).toLocaleTimeString()}${cachedNote}`;
    return null; // no error
  } catch (e) {
    cfg.statusText.textContent = 'Failed to load';
    cfg.positionsContainer.innerHTML = '';
    cfg.portfolioContainer.innerHTML = '';
    return `${name}: ${e.message}`;
  }
}

async function loadAll(bust) {
  loadBtn.disabled = true;
  errorBanner.classList.remove('visible');

  const errors = (await Promise.all([loadProtocol('snuggle', bust), loadProtocol('maxfi', bust)]))
    .filter(Boolean);

  loadClosedPositions('snuggle');
  loadClosedPositions('maxfi');

  if (errors.length) {
    errorBanner.textContent = 'Error: ' + errors.join(' | ');
    errorBanner.classList.add('visible');
  }
  loadBtn.disabled = false;
}

function resetAutoRefresh() {
  if (autoRefreshTimer) clearInterval(autoRefreshTimer);
  autoRefreshTimer = setInterval(() => loadAll(false), AUTO_REFRESH_MS);
}

loadAll(false);
loadHistory('snuggle');
loadHistory('maxfi');
loadClosedPositions('snuggle');
loadClosedPositions('maxfi');
resetAutoRefresh();
</script>
